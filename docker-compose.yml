version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '5000'
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:8080
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - internal

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - internal

volumes:
  app_data:

networks:
  internal:
    driver: bridge
